<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <title>Mail Viewer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-900 text-white min-h-screen">
  <!-- Auth modal -->
  <div id="authModal" class="hidden fixed inset-0 bg-black/60 flex items-center justify-center p-4">
    <div class="w-full max-w-md bg-slate-800 border border-slate-700 rounded-2xl p-6">
      <div class="text-xl font-bold mb-2">🔐 Nhập password</div>
      <div class="text-slate-300 mb-4 text-sm">Nhập password để xem email</div>

      <input id="passwordInput" type="password"
        class="w-full px-4 py-2 rounded-lg bg-slate-900 border border-slate-700"
        placeholder="Password" />

      <div id="authError" class="text-red-400 text-sm mt-2"></div>

      <button id="authBtn"
        class="mt-4 w-full px-4 py-2 rounded-lg bg-blue-600 hover:bg-blue-500">
        Mở
      </button>
    </div>
  </div>

  <div id="app" class="max-w-5xl mx-auto p-6">
    <div class="flex items-center justify-between gap-3 mb-6">
      <h1 class="text-3xl font-bold">📬 Mail Viewer</h1>
      <button id="logoutBtn" class="px-3 py-2 rounded-lg bg-slate-800 border border-slate-700 hover:bg-slate-700">
        Logout
      </button>
    </div>

    <!-- Controls -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-2 mb-6">
      <input id="tagInput" placeholder="Nhập tag (vd: gptno1)"
        class="px-4 py-2 rounded-lg bg-slate-800 border border-slate-700" />
      <input id="searchInput" placeholder="Search subject..."
        class="px-4 py-2 rounded-lg bg-slate-800 border border-slate-700" />
      <button id="loadBtn"
        class="px-4 py-2 rounded-lg bg-blue-600 hover:bg-blue-500">
        Load
      </button>
    </div>

    <div id="status" class="text-slate-400 mb-4"></div>
    <div id="mailList" class="space-y-4"></div>
  </div>

  <script type="module" src="./assets/app.js"></script>
</body>
</html>
